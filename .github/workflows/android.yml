name: Android Kotlin CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Habilitar Gradle wrapper
        run: chmod +x ./gradlew
      - name: Tests JVM
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Compilar APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Validate English and Spanish resources
        run: python3 tools/check_localization.py
      - name: Informational JVM coverage
        run: ./gradlew --no-daemon :app:jacocoDebugUnitTestReport
      - name: Informational Detekt audit
        run: ./gradlew --no-daemon detekt detektComplexity
      - name: Summarize Detekt reports
        run: python3 tools/detekt_summary.py
      - name: Summarize JVM coverage and reviewed method matches
        run: python3 tools/coverage_summary.py
      - name: Upload JVM coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DidgeTaller-JVM-Coverage
          path: app/build/reports/jacoco/debug/
          if-no-files-found: error
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DidgeTaller-Detekt
          path: build/reports/detekt/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: DidgeTaller-Kotlin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
