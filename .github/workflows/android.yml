name: Android Kotlin CI
on:
  push:
    paths: ['app/**', 'engineering-tools/**', 'tools/**', 'config/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew*', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['app/**', 'engineering-tools/**', 'tools/**', 'config/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew*', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A branch push and its PR update validate the same head: keep one automatic run.
  # Fork branches and explicitly dispatched evidence runs retain separate ownership.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache dependency downloads only
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-downloads-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-downloads-
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android and native build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Tests JVM
        run: ./gradlew --no-daemon :engineering-tools:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Differential synthetic contracts against pinned original main
        run: |
          git fetch --no-tags origin 3a160043f9ebb3a420b1d89a9cf4ddfe7d1b5d67
          git worktree add --detach "$RUNNER_TEMP/didge-original" 3a160043f9ebb3a420b1d89a9cf4ddfe7d1b5d67
          (cd "$RUNNER_TEMP/didge-original" && bash ./gradlew --no-daemon :app:compileDebugKotlin)
          jar --create --file "$RUNNER_TEMP/didge-original.jar" -C "$RUNNER_TEMP/didge-original/app/build/tmp/kotlin-classes/debug" .
          ./gradlew --no-daemon :app:qualityDifferential "-PdifferentialBaseline=$RUNNER_TEMP/didge-original.jar"
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Validate English and Spanish resources
        run: python3 tools/check_localization.py
      - name: Informational JVM coverage
        run: ./gradlew --no-daemon :app:jacocoDebugUnitTestReport
      - name: Informational Detekt audit
        run: ./gradlew --no-daemon detekt detektComplexity
      - name: Summarize Detekt reports
        run: python3 tools/detekt_summary.py
      - name: Summarize JVM coverage and reviewed method matches
        run: |
          ./gradlew --no-daemon :engineering-tools:sourceInventory
          python3 tools/coverage_summary.py
      - name: Kotlin CPD
        run: ./gradlew --no-daemon :app:qualityDuplication
      - name: Ratchet coverage, reliable CRAP-L, complexity and duplication
        run: python3 tools/quality_gate.py
      - name: Test quality failure semantics
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Quality-Metrics-and-Test-Results
          path: |
            build/reports/quality/
            app/build/reports/quality/cpd.xml
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: error
      - name: Upload JVM coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: DidgeTaller-JVM-Coverage
          path: app/build/reports/jacoco/debug/
          if-no-files-found: error
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: DidgeTaller-Detekt
          path: build/reports/detekt/
          if-no-files-found: error
