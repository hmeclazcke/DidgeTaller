name: Full emulator and manual mutation quality
on:
  push:
    branches: [main, refactor/uncle-bob-rebuild]
    paths: ['app/**', 'engineering-tools/**', 'tools/**', 'config/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew*', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      scope:
        description: Select deep checks without repeating unchanged successful evidence
        type: choice
        default: all
        options: [all, instrumentation, mutation, metronome, localization]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.scope || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  mutation:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'mutation')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache dependency downloads only
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-downloads-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-downloads-
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - name: Enforced focused mutations and informational expanded domain analysis
        run: ./gradlew --no-daemon -Pkotlin.incremental=false :app:qualityMutation :app:qualityMutationDomain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Kotlin-Mutations
          path: app/build/reports/quality/pit*/
          retention-days: 7
          if-no-files-found: error
  instrumentation:
    name: ${{ inputs.scope == 'localization' && 'Focused localization and navigation (not full suite)' || inputs.scope == 'metronome' && 'Focused Measure and metronome UI (not full suite)' || 'instrumentation' }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache dependency downloads only
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-downloads-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-downloads-
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon -Pkotlin.incremental=false -PandroidCoverage=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ${{ inputs.scope == 'localization' && 'scripts/run-localization-quality.sh' || inputs.scope == 'metronome' && 'scripts/run-metronome-quality.sh' || 'scripts/run-emulator-quality.sh' }} emulator-5554
      - name: Separate emulator coverage report
        if: always() && inputs.scope != 'metronome' && inputs.scope != 'localization'
        run: |
          ./gradlew --no-daemon -Pkotlin.incremental=false -PandroidCoverage=true :app:jacocoEmulatorReport detekt detektComplexity :engineering-tools:sourceInventory :engineering-tools:bytecodeInventory
          python3 tools/emulator_coverage_summary.py
          python3 tools/detekt_summary.py > build/reports/quality/android-detekt-summary.log
          python3 tools/function_mapping.py --coverage app/build/reports/jacoco/emulator/coverage.xml --output build/reports/quality/android-function-mapping.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.scope == 'localization' && 'Focused-Localization-Results' || inputs.scope == 'metronome' && 'Focused-Metronome-Results' || 'Complete-Emulator-Results' }}
          path: |
            build/reports/quality/instrumentation.*
            build/reports/quality/localization-*.txt
            build/reports/quality/library-screenshots/
            build/reports/quality/library-configuration-*.txt
            build/reports/quality/session-screenshots/
            build/reports/quality/workspace-configuration-*.txt
            build/reports/quality/metronome-screenshots/
            build/reports/quality/measure-screenshots/
            build/reports/quality/measure-synthetic-screenshots/
            build/reports/quality/metronome-configuration-*.txt
            build/reports/quality/android-function-mapping.json
            build/reports/quality/source-inventory.xml
            build/reports/quality/jvm-method-inventory.xml
            app/build/reports/jacoco/emulator/
          retention-days: 7
          if-no-files-found: error
