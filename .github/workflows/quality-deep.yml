name: Deep quality (manual, full emulator and focused mutations)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:qualityMutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Focused-Kotlin-Mutations
          path: app/build/reports/quality/pit/
          retention-days: 7
          if-no-files-found: error
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tools/run_instrumentation.py --serial emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Complete-Emulator-Results
          path: build/reports/quality/instrumentation.*
          retention-days: 7
          if-no-files-found: error
